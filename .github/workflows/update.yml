name: SPACE WEATHER DRAG DAILY

on:
  workflow_dispatch:

  schedule:
    - cron: "17 5,13,21 * * *"

permissions:
  contents: write

concurrency:
  group: space-weather-drag-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # Install libs
      # -------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            numpy \
            scipy \
            sgp4 \
            skyfield \
            pymsis

      # -------------------------
      # Prepare dirs
      # -------------------------
      - name: Prepare folders
        run: |
          mkdir -p docs/data
          mkdir -p docs/data/catalog
          mkdir -p docs/data/sat_history
          mkdir -p docs/data/noaa
          mkdir -p docs/data/analysis
          mkdir -p docs/data/launches
          mkdir -p docs/data/tle
          mkdir -p docs/data/tle_history

      # -------------------------
      # Space-Track TLE history
      # -------------------------
      - name: Build Space-Track TLE history
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: python scripts/build_tle_history.py

      # -------------------------
      # Space-Track SATCAT full
      # -------------------------
      - name: Build Space-Track SATCAT full
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: python scripts/build_satcat_full.py

      # -------------------------
      # Space-Track SATCAT analytics
      # -------------------------
      - name: Build Space-Track SATCAT analytics
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: python scripts/build_satcat_analytics.py

      # -------------------------
      # CelesTrak catalog
      # -------------------------
      - name: Fetch full CelesTrak catalog snapshot
        run: |
          for i in 1 2 3
          do
            echo "CelesTrak catalog fetch attempt $i"

            python scripts/fetch_catalog.py && exit 0

            echo "CelesTrak catalog fetch failed. Retry in 20 sec..."
            sleep 20
          done

          echo "CelesTrak catalog fetch failed after retries."
          echo "Continue with existing catalog files."
          exit 0

      # -------------------------
      # Launch calendar
      # -------------------------
      - name: Fetch launch calendar
        run: python scripts/fetch_launches.py

      # -------------------------
      # sat_history
      # -------------------------
      - name: Rebuild satellite histories
        run: python scripts/build_sat_history.py

      # -------------------------
      # Search indexes
      # SATCATとsat_historyの更新後に実行する
      # -------------------------
      - name: Validate satellite index builder
        run: python -m py_compile scripts/build_satellite_index_full.py

      - name: Build split satellite search indexes
        run: python scripts/build_satellite_index_full.py

      # merge_satcat_into_index.py は実行しない。
      # build_satellite_index_full.py がSATCAT結合と分割を一括で行うため、
      # 後から旧スクリプトを実行すると各インデックス間で不整合になる。

      # -------------------------
      # Validate generated indexes
      # -------------------------
      - name: Validate generated satellite indexes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("docs/data/satellite_index_geo_payload.json"),
              Path("docs/data/satellite_index_payload.json"),
              Path("docs/data/satellite_index_non_geo_payload.json"),
              Path("docs/data/satellite_index_other.json"),
              Path("docs/data/satellite_index_full.json"),
              Path("docs/data/satellite_index_manifest.json"),
          ]

          failed = False

          for path in required:
              if not path.exists():
                  print(f"ERROR: missing {path}")
                  failed = True
                  continue

              if path.stat().st_size == 0:
                  print(f"ERROR: empty {path}")
                  failed = True
                  continue

              try:
                  with path.open("r", encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as exc:
                  print(f"ERROR: invalid JSON {path}: {exc}")
                  failed = True
                  continue

              if path.name == "satellite_index_manifest.json":
                  datasets = data.get("datasets", {}) if isinstance(data, dict) else {}
                  print(f"OK: {path} datasets={list(datasets.keys())}")
              else:
                  count = len(data) if isinstance(data, list) else "not-list"
                  print(f"OK: {path} count={count}")

          if failed:
              raise SystemExit(1)
          PY

      # -------------------------
      # Debug
      # -------------------------
      - name: Show generated files
        run: |
          echo "===== tle latest count ====="
          find docs/data/tle -name "*.json" | wc -l

          echo ""
          echo "===== tle_history count ====="
          find docs/data/tle_history -name "*.json" | wc -l

          echo ""
          echo "===== tle index ====="
          ls -lh docs/data/tle/index.json || echo "tle index missing"

          echo ""
          echo "===== tle_history index ====="
          ls -lh docs/data/tle_history/index.json || echo "tle_history index missing"

          echo ""
          echo "===== satcat full ====="
          ls -lh docs/data/catalog/satcat_full.json || echo "satcat full missing"

          echo ""
          echo "===== satcat analytics ====="
          ls -lh docs/data/catalog/satcat_analytics.json || echo "satcat analytics missing"

          echo ""
          echo "===== sat_history count ====="
          find docs/data/sat_history -name "*.json" | wc -l

          echo ""
          echo "===== catalog ====="
          ls -lh docs/data/catalog | tail -20

          echo ""
          echo "===== split satellite indexes ====="
          ls -lh \
            docs/data/satellite_index_geo_payload.json \
            docs/data/satellite_index_payload.json \
            docs/data/satellite_index_non_geo_payload.json \
            docs/data/satellite_index_other.json \
            docs/data/satellite_index_full.json \
            docs/data/satellite_index_manifest.json

          echo ""
          echo "===== satellite index manifest ====="
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/data/satellite_index_manifest.json")
          with path.open("r", encoding="utf-8") as f:
              manifest = json.load(f)

          print(json.dumps(manifest.get("datasets", {}), ensure_ascii=False, indent=2))
          print(json.dumps(manifest.get("source_counts", {}), ensure_ascii=False, indent=2))
          PY

          echo ""
          echo "===== NOAA ====="
          ls -lh docs/data/noaa || echo "NOAA missing"

          echo ""
          echo "===== launches ====="
          ls -lh docs/data/launches || echo "launches missing"

          echo ""
          echo "===== analysis count ====="
          find docs/data/analysis -name "*.json" | wc -l

      # -------------------------
      # Git status
      # -------------------------
      - name: Git status
        run: |
          git status
          git branch
          git log --oneline -5

      # -------------------------
      # Commit & push
      # -------------------------
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"

          git fetch origin main

          git add docs/data

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Update satellite data and split search indexes"

          for i in 1 2 3
          do
            echo "Rebase attempt $i"

            git pull --rebase origin main && break

            echo "Retry in 5 sec..."
            sleep 5
          done

          for i in 1 2 3
          do
            echo "Push attempt $i"

            git push && break

            echo "Push retry in 5 sec..."

            git pull --rebase origin main || true

            sleep 5
          done
